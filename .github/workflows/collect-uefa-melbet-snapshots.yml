name: Capture unified MelBet odds snapshots

on:
  push:
    branches:
      - main
    paths:
      - "backend/collect_uefa_melbet_snapshots.py"
      - "backend/refresh_pitchapi_uefa_fixtures.py"
      - "backend/build_uefa_app_feed.py"
      - "backend/build_market_roi.py"
      - "backend/audit_domestic_ai_signals.py"
      - "backend/apply_melbet_snapshots.py"
      - "backend/predict_uefa_markets.py"
      - "backend/update_odds_api_sport.py"
      - ".github/workflows/collect-uefa-melbet-snapshots.yml"
      - ".github/workflows/update-data.yml"
      - ".github/workflows/update-odds-only.yml"
  workflow_dispatch:
    inputs:
      full_history:
        description: "Refresh all available UEFA fixture seasons (higher API usage)"
        required: false
        default: false
        type: boolean
      diagnose_missing_boards:
        description: "Read-only full upcoming UECL calendar coverage audit against API-Sport (up to 180 days)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 */3 * * *"

concurrency:
  group: football-feed-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore incremental UEFA fixture cache
        uses: actions/cache@v4
        with:
          path: |
            backend/cache/pitchapi_uefa_fixtures.json
          key: pitchapi-uefa-fixtures-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pitchapi-uefa-fixtures-v1-${{ runner.os }}-
      - name: Restore domestic PitchAPI xG cache
        uses: actions/cache@v4
        with:
          path: backend/cache/pitchapi_history.json
          key: pitchapi-history-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pitchapi-history-${{ runner.os }}-${{ github.ref_name }}-
      - name: Require domestic PitchAPI history cache
        run: test -s backend/cache/pitchapi_history.json
      - name: Install dependencies
        run: python -m pip install requests
      - name: Backfill all available UEFA fixture seasons
        if: github.event_name == 'workflow_dispatch' && inputs.full_history
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python backend/refresh_pitchapi_uefa_fixtures.py
      - name: Refresh latest UEFA season fixtures
        if: github.event_name != 'workflow_dispatch' || !inputs.full_history
        continue-on-error: true
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python backend/refresh_pitchapi_uefa_fixtures.py --upcoming-only
      - name: Require a cached UEFA fixture list
        run: test -s backend/cache/pitchapi_uefa_fixtures.json
      - name: Diagnose missing MelBet boards (read-only, max 30 API calls)
        if: github.event_name == 'workflow_dispatch' && inputs.diagnose_missing_boards
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/diagnose_uefa_melbet_missing_boards.py
      - name: Audit full upcoming UECL API-Sport coverage (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.diagnose_missing_boards
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/diagnose_uecl_api_sport_coverage.py
      - name: Update UEFA xG history for newly finished matches
        if: hashFiles('artifacts/uefa-xg-history.json') != ''
        continue-on-error: true
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python backend/update_uefa_xg_history.py
      - name: Migrate legacy UEFA snapshot archive to the shared archive
        run: |
          if [ -f artifacts/uefa-melbet-odds-snapshots.jsonl ]; then
            cat artifacts/uefa-melbet-odds-snapshots.jsonl >> artifacts/all-eight-competitions-melbet-snapshots.jsonl
            rm artifacts/uefa-melbet-odds-snapshots.jsonl
          fi
      - name: Capture MelBet snapshots for all eight competitions
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/collect_uefa_melbet_snapshots.py
      - name: Evaluate paper-only BET WAIT REJECT signals from MelBet snapshots
        run: python backend/evaluate_uefa_paper_signals.py
      - name: Settle paper bets whose matches have finished
        run: python backend/settle_uefa_paper_bets.py
      - name: Apply fresh MelBet snapshots to domestic competitions
        run: python backend/apply_melbet_snapshots.py
      - name: Build UEFA competitions for the Android match centre
        run: python backend/build_uefa_app_feed.py
      - name: Audit Android strongest AI signal across all eight competitions
        run: |
          python backend/audit_domestic_ai_signals.py \\
            --input docs/data.json \\
            --uefa-input docs/uefa-data.json \\
            --json-out artifacts/eight-competition-ai-signal-audit.json \\
            --markdown-out artifacts/eight-competition-ai-signal-audit.md
      - name: Freeze one historical MelBet quote per ALL forecast and publish settled ROI data
        run: python backend/build_market_roi.py
      - name: Commit compact historical ROI archive and evaluation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The full rolling quote stream is runner-local. Only one compact quote
          # per frozen forecast/market is retained in Git, avoiding the 100 MB limit.
          if [ -f artifacts/market-roi-quotes.jsonl ]; then
            git add artifacts/market-roi-quotes.jsonl
          fi
          if [ -f artifacts/uefa-xg-history.json ]; then
            git add artifacts/uefa-xg-history.json
          fi
          if [ -f artifacts/uefa-paper-signals.jsonl ]; then
            git add artifacts/uefa-paper-signals.jsonl
          fi
          if [ -f artifacts/uefa-paper-bets.jsonl ]; then
            git add artifacts/uefa-paper-bets.jsonl
          fi
          if [ -f artifacts/uefa-paper-settlements.jsonl ]; then
            git add artifacts/uefa-paper-settlements.jsonl
          fi
          if [ -f docs/market-roi.json ]; then
            git add docs/market-roi.json
          fi
          if [ -f docs/uefa-data.json ]; then
            git add docs/uefa-data.json
          fi
          if [ -f docs/data.json ]; then
            git add docs/data.json
          fi
          git diff --cached --quiet || git commit -m "Capture frozen MelBet forecast ROI quotes"
          # Some feed builders may touch already tracked generated files after
          # the explicit staging list. Commit those tracked updates before rebase
          # so pull never runs with a dirty index/worktree.
          git add -u
          git diff --cached --quiet || git commit -m "Include generated tracked feed updates"
          git status --short
          git pull --rebase origin main
          git push
      - name: Upload eight-competition AI signal audit
        uses: actions/upload-artifact@v4
        with:
          name: eight-competition-ai-signal-audit-${{ github.run_number }}
          path: |
            artifacts/eight-competition-ai-signal-audit.json
            artifacts/eight-competition-ai-signal-audit.md
          if-no-files-found: error
          retention-days: 30
