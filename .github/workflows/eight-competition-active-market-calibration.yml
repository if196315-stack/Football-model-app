name: Eight-competition active-market calibration

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/backtest_all_markets.py"
      - "backend/test_backtest_all_markets.py"
      - ".github/workflows/eight-competition-active-market-calibration.yml"
  push:
    branches: [feature/champagne-gold-stats]
    paths:
      - "backend/backtest_all_markets.py"
      - "backend/test_backtest_all_markets.py"
      - ".github/workflows/eight-competition-active-market-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eight-competition-active-market-calibration
  cancel-in-progress: false

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore persisted PitchAPI xG history
        uses: actions/cache/restore@v4
        with:
          path: backend/cache/pitchapi_history.json
          key: pitchapi-history-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pitchapi-history-Linux-main-
            pitchapi-history-Linux-
      - name: Install audit dependencies
        run: python -m pip install requests pandas numpy
      - name: Test active-market walk-forward and calibration
        run: python -m unittest backend/test_backtest_all_markets.py -v
      - name: Export clean domestic paired-xG history
        run: python backend/export_pitchapi_backtest.py
      - name: Run eight-competition, eight-market calibration
        run: |
          python backend/backtest_all_markets.py \
            --domestic artifacts/pitchapi-clean-candidate.csv \
            --uefa artifacts/uefa-xg-history.json \
            --output artifacts/eight-competition-active-market-calibration.json \
            --holdout-from 2026-07-01
      - name: Publish calibration summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/eight-competition-active-market-calibration.json").read_text())
          lines = [
              "# Eight-competition / eight-market calibration",
              "",
              f"- Input matches: **{report['input_matches']}**",
              f"- Walk-forward predictions by competition: {report['predicted_matches_by_competition']}",
              f"- Holdout starts: **{report['holdout_from']}**",
              "",
              "| Market | Holdout N | Brier skill vs historical baseline | Log-loss skill vs historical baseline | Calibrated Δ Brier (raw − calibrated) |",
              "|---|---:|---:|---:|---:|",
          ]
          for market, data in report["markets"].items():
              holdout = data.get("holdout")
              cal = data.get("calibration_global", {})
              if holdout:
                  n = holdout["model"]["n"]
                  bs = f"{holdout['brier_skill']:.2%}"
                  ls = f"{holdout['log_loss_skill']:.2%}"
              else:
                  n, bs, ls = 0, "n/a", "n/a"
              delta = cal.get("brier_delta_vs_raw")
              lines.append(f"| {market} | {n} | {bs} | {ls} | {delta:+.6f} |" if delta is not None else f"| {market} | {n} | {bs} | {ls} | n/a |")
          lines += ["", "## Per-competition holdout skill", ""]
          for market, data in report["markets"].items():
              lines.append(f"### {market}")
              lines.append("")
              lines.append("| Competition | N | Brier skill | Log-loss skill |")
              lines.append("|---|---:|---:|---:|")
              for league, value in data.get("holdout_by_competition", {}).items():
                  if value:
                      lines.append(f"| {league} | {value['model']['n']} | {value['brier_skill']:.2%} | {value['log_loss_skill']:.2%} |")
              lines.append("")
          lines += [
              "## Interpretation guardrails",
              "",
              "- Baseline is expanding historical frequency with Laplace smoothing, not bookmaker odds.",
              "- Calibration is trained only on dates before the holdout and evaluated only on the holdout.",
              "- The xG research model is not automatically identical to Android production probabilities.",
              "- No historical odds means no verified EV, CLV or ROI conclusion.",
              "- Production probabilities and betting thresholds are not changed by this research run.",
          ]
          Path("calibration-summary.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY
      - name: Upload reproducible datasets and calibration report
        uses: actions/upload-artifact@v4
        with:
          name: eight-competition-active-market-calibration-${{ github.run_number }}
          path: |
            artifacts/pitchapi-clean-candidate.csv
            artifacts/pitchapi-clean-candidate-manifest.json
            artifacts/eight-competition-active-market-calibration.json
            calibration-summary.md
          if-no-files-found: error
          retention-days: 30
