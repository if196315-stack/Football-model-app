name: Audit Soccer365 xG coverage

on:
  push:
    paths:
      - "backend/audit_soccer365.py"
      - ".github/workflows/audit-soccer365.yml"
  workflow_dispatch:

concurrency:
  group: soccer365-xg-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Audit Soccer365 match and xG coverage
        run: python backend/audit_soccer365.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: soccer365-xg-audit
          path: soccer365-xg-audit.json
          retention-days: 14
