name: Diagnose BetBoom team-total odds

on:
  workflow_dispatch:
    inputs:
      fixture_ids:
        description: "Comma-separated API-Sport match IDs (max 5); defaults to Man City-Fulham"
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Compare bulk-by-ID and per-match BetBoom boards
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
          API_SPORT_DIAGNOSTIC_IDS: ${{ inputs.fixture_ids }}
        run: python backend/diagnose_betboom_team_totals.py
