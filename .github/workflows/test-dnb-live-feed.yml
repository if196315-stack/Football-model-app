name: DNB live MelBet feed test (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/test/restore-melbet-handicap-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/restore-melbet-handicap-zero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Read-only MelBet DNB feed audit
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/audit_dnb_live_feed.py --output dnb-live-feed-audit.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dnb-live-feed-audit
          path: dnb-live-feed-audit.json
          if-no-files-found: error
          retention-days: 7
