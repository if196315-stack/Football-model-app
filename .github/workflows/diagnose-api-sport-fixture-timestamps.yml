name: API-Sport 39 fixture timestamp audit

on:
  push:
    branches:
      - "audit/api-sport-tournament-ids"
    paths:
      - "backend/diagnose_api_sport_fixture_timestamps.py"
      - ".github/workflows/diagnose-api-sport-fixture-timestamps.yml"

permissions:
  contents: read

jobs:
  timestamp-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependency
        run: python -m pip install requests
      - name: Capture raw kickoff fields for 39 shifted fixtures
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/diagnose_api_sport_fixture_timestamps.py
