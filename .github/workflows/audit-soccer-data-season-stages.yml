name: Audit Soccer Data season stage counts

on:
  push:
    branches:
      - feature/soccer365-source-migration
    paths:
      - "backend/soccer_data_season_stage_audit.py"
      - "backend/test_soccer_data_season_stage_audit.py"
      - ".github/workflows/audit-soccer-data-season-stages.yml"

permissions:
  contents: read

jobs:
  stage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Run stage audit unit tests
        run: python -m unittest discover -s backend -p "test_soccer_data_season_stage_audit.py" -v
      - name: Audit regular and playoff match counts
        env:
          SOCCER_DATA_KEY: ${{ secrets.SOCCER_DATA_KEY }}
        run: python backend/soccer_data_season_stage_audit.py --output soccer-data-stage-audit.json
      - name: Upload stage audit report
        uses: actions/upload-artifact@v4
        with:
          name: soccer-data-season-stage-audit
          path: soccer-data-stage-audit.json
          if-no-files-found: error
          retention-days: 14
