name: Update odds and archive snapshots

on:
  push:
    branches:
      - main
    paths:
      - "backend/update_odds_api_sport.py"
      - "backend/collect_odds_snapshots.py"
      - ".github/workflows/update-odds-only.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

concurrency:
  group: football-domestic-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-odds:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Refresh bookmaker odds via API-Sport
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/update_odds_api_sport.py
      - name: Append immutable model-market odds snapshots
        run: python backend/collect_odds_snapshots.py --input docs/data.json --output artifacts/melbet-odds-snapshots.jsonl
      - name: Evaluate archived observations with available final scores
        run: python backend/evaluate_market_observations.py --snapshots artifacts/melbet-odds-snapshots.jsonl --data docs/data.json --output artifacts/melbet-market-observation-results.jsonl
      - name: Commit refreshed odds and snapshot history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if [ -f artifacts/melbet-odds-snapshots.jsonl ]; then
            git add artifacts/melbet-odds-snapshots.jsonl
          fi
          if [ -f artifacts/melbet-market-observation-results.jsonl ]; then
            git add artifacts/melbet-market-observation-results.jsonl
          fi
          git diff --cached --quiet || git commit -m "Update odds and append snapshot history"
          git pull --rebase origin main
          git push
