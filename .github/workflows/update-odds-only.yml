name: Update odds and archive snapshots

on:
  workflow_dispatch:

concurrency:
  group: football-feed-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-odds:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Refresh bookmaker odds via API-Sport
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/update_odds_api_sport.py
      - name: Append immutable model-market odds snapshots
        run: python backend/collect_odds_snapshots.py --input docs/data.json --output artifacts/melbet-odds-snapshots.jsonl
      - name: Evaluate archived observations with available final scores
        run: python backend/evaluate_market_observations.py --snapshots artifacts/melbet-odds-snapshots.jsonl --data docs/data.json --output artifacts/melbet-market-observation-results.jsonl
      - name: Apply unified fresh active MelBet snapshots to production feed
        run: python backend/apply_melbet_snapshots.py
      - name: Commit refreshed odds and snapshot history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The snapshot archive is already larger than GitHub's 100 MB single-file limit.
          # Keep the rolling archive local to this runner; publish the production feed independently.
          # A diagnostic archive must never block fresh odds in docs/data.json from reaching the app.
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update MelBet odds feed"
          git pull --rebase origin main
          git push
