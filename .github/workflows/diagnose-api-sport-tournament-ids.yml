name: API-Sport seven tournament ID lookup

on:
  push:
    branches:
      - "audit/api-sport-tournament-ids"
    paths:
      - "backend/diagnose_api_sport_tournament_ids.py"
      - ".github/workflows/diagnose-api-sport-tournament-ids.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependency
        run: python -m pip install requests
      - name: Resolve seven competition tournament IDs
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/diagnose_api_sport_tournament_ids.py
