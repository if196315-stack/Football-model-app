name: Diagnose available odds markets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-event-markets.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Inspect one upcoming event per league
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python backend/diagnose_event_markets.py
