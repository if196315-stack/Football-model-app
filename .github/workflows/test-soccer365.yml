name: Test Soccer365 adapter

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/test-soccer365.yml"
  push:
    branches:
      - feature/soccer365-source-migration
    paths:
      - "backend/**"
      - ".github/workflows/test-soccer365.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install requests
      - name: Run Soccer365 parser unit tests
        run: python -m unittest discover -s backend -p "test_soccer365*.py" -v
