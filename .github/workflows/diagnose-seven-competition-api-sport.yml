name: Seven-competition API-Sport coverage diagnostic

on:
  push:
    branches:
      - main
      - "audit/**"
    paths:
      - "backend/diagnose_seven_competition_api_sport.py"
      - ".github/workflows/diagnose-seven-competition-api-sport.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-competition-api-sport-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded diagnostic dependency
        run: python -m pip install requests
      - name: Test bounded competition sampling
        run: python -m unittest backend/test_diagnose_seven_competition_api_sport.py -v
      - name: Check one upcoming fixture per target competition
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/diagnose_seven_competition_api_sport.py
