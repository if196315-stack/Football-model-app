name: PitchAPI UEFA coverage diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pitchapi-uefa-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependency
        run: python -m pip install requests
      - name: Inspect UEFA competitions and fixture listings
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python backend/diagnose_pitchapi_uefa.py
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: pitchapi-uefa-coverage-diagnostic
          path: pitchapi-uefa-diagnostic.json
          if-no-files-found: error
          retention-days: 14
