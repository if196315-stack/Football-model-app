name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "backend/**"
      - ".github/workflows/build-apk.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "backend/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Run Android unit tests
        working-directory: android
        shell: bash
        run: |
          run_gradle_with_retry() {
            local task="$1"
            local log_file="$RUNNER_TEMP/gradle-${task//:/-}.log"
            local attempt status

            for attempt in 1 2 3; do
              echo "Running $task (attempt $attempt/3)"
              set +e
              gradle "$task" --no-daemon --stacktrace 2>&1 | tee "$log_file"
              status=${PIPESTATUS[0]}
              set -e

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if ! grep -Eqi 'status code 429|HTTP[^[:cntrl:]]*429|Too Many Requests' "$log_file"; then
                return "$status"
              fi

              if [ "$attempt" -lt 3 ]; then
                local delay=$((attempt * 20))
                echo "Maven returned HTTP 429; retrying in ${delay}s."
                sleep "$delay"
              fi
            done

            echo "Dependency download still rate-limited after 3 attempts."
            return "$status"
          }

          run_gradle_with_retry :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          run_gradle_with_retry() {
            local task="$1"
            local log_file="$RUNNER_TEMP/gradle-${task//:/-}.log"
            local attempt status

            for attempt in 1 2 3; do
              echo "Running $task (attempt $attempt/3)"
              set +e
              gradle "$task" --no-daemon --stacktrace 2>&1 | tee "$log_file"
              status=${PIPESTATUS[0]}
              set -e

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if ! grep -Eqi 'status code 429|HTTP[^[:cntrl:]]*429|Too Many Requests' "$log_file"; then
                return "$status"
              fi

              if [ "$attempt" -lt 3 ]; then
                local delay=$((attempt * 20))
                echo "Maven returned HTTP 429; retrying in ${delay}s."
                sleep "$delay"
              fi
            done

            echo "Dependency download still rate-limited after 3 attempts."
            return "$status"
          }

          run_gradle_with_retry :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Model-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
