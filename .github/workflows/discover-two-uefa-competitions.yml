name: Discover UEFA Nations League and Conference League coverage

on:
  push:
    branches:
      - main
      - "audit/**"
    paths:
      - "backend/diagnose_two_uefa_competitions.py"
      - "backend/test_diagnose_two_uefa_competitions.py"
      - ".github/workflows/discover-two-uefa-competitions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-two-uefa-competitions
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependency
        run: python -m pip install requests
      - name: Compile discovery script
        run: python -m py_compile backend/diagnose_two_uefa_competitions.py backend/test_diagnose_two_uefa_competitions.py
      - name: Run discovery regression tests
        run: python -m unittest backend/test_diagnose_two_uefa_competitions.py -v
      - name: Check PitchAPI catalogue and API-Sport BetBoom coverage
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/diagnose_two_uefa_competitions.py
