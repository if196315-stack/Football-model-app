name: Update AI candidate lineups

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/update_ai_lineups.py"
      - "backend/football_api_lineups.py"
      - ".github/workflows/update-ai-lineups.yml"

concurrency:
  group: football-data-json-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-ai-lineups:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Restore shared PitchAPI and API-Football cache
        uses: actions/cache@v4
        with:
          path: backend/cache/pitchapi_history.json
          key: pitchapi-history-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pitchapi-history-${{ runner.os }}-${{ github.ref_name }}-
      - name: Fetch lineups only for qualifying AI candidates
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_MAX_REQUESTS_PER_RUN: "100"
          API_FOOTBALL_DAILY_REQUEST_LIMIT: "100"
        run: python backend/update_ai_lineups.py
      - name: Commit AI lineup updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Refresh API-Football lineups for AI candidates"
          git pull --rebase origin main
          git push
