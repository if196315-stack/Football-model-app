name: Capture UEFA BetBoom odds snapshots

on:
  push:
    branches:
      - main
    paths:
      - "backend/collect_uefa_betboom_snapshots.py"
      - "backend/refresh_pitchapi_uefa_fixtures.py"
      - "backend/build_uefa_app_feed.py"
      - ".github/workflows/collect-uefa-betboom-snapshots.yml"
  workflow_dispatch:
    inputs:
      full_history:
        description: "Refresh all available PitchAPI UEFA seasons (higher API usage)"
        required: false
        default: false
        type: boolean
      diagnose_missing_boards:
        description: "Read-only exact-ID audit of up to 15 UEFA fixtures missing BetBoom boards"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 */3 * * *"

concurrency:
  group: football-uefa-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore incremental UEFA fixture cache
        uses: actions/cache@v4
        with:
          path: |
            backend/cache/pitchapi_uefa_fixtures.json
          key: pitchapi-uefa-fixtures-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pitchapi-uefa-fixtures-v1-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install requests
      - name: Backfill all available UEFA fixture seasons
        if: github.event_name == 'workflow_dispatch' && inputs.full_history
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python backend/refresh_pitchapi_uefa_fixtures.py
      - name: Refresh latest UEFA season fixtures
        if: github.event_name != 'workflow_dispatch' || !inputs.full_history
        continue-on-error: true
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python backend/refresh_pitchapi_uefa_fixtures.py --upcoming-only
      - name: Require a cached UEFA fixture list
        run: test -s backend/cache/pitchapi_uefa_fixtures.json
      - name: Diagnose missing BetBoom boards (read-only, max 15 API calls)
        if: github.event_name == 'workflow_dispatch' && inputs.diagnose_missing_boards
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/diagnose_uefa_betboom_missing_boards.py
      - name: Update UEFA xG history for newly finished matches
        if: hashFiles('artifacts/uefa-xg-history.json') != ''
        continue-on-error: true
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python backend/update_uefa_xg_history.py
      - name: Capture timestamped BetBoom market quotes
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/collect_uefa_betboom_snapshots.py
      - name: Evaluate paper-only BET WAIT REJECT signals
        run: python backend/evaluate_uefa_paper_signals.py
      - name: Settle paper bets whose matches have finished
        run: python backend/settle_uefa_paper_bets.py
      - name: Build UEFA competitions for the Android match centre
        run: python backend/build_uefa_app_feed.py
      - name: Commit immutable UEFA odds history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f artifacts/uefa-betboom-odds-snapshots.jsonl ]; then
            git add artifacts/uefa-betboom-odds-snapshots.jsonl
          fi
          if [ -f artifacts/uefa-xg-history.json ]; then
            git add artifacts/uefa-xg-history.json
          fi
          if [ -f artifacts/uefa-paper-signals.jsonl ]; then
            git add artifacts/uefa-paper-signals.jsonl
          fi
          if [ -f artifacts/uefa-paper-bets.jsonl ]; then
            git add artifacts/uefa-paper-bets.jsonl
          fi
          if [ -f artifacts/uefa-paper-settlements.jsonl ]; then
            git add artifacts/uefa-paper-settlements.jsonl
          fi
          if [ -f docs/uefa-data.json ]; then
            git add docs/uefa-data.json
          fi
          git diff --cached --quiet || git commit -m "Capture UEFA BetBoom odds snapshots"
          git pull --rebase origin main
          git push
