name: Update football data

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: football-data-json-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    # This production updater is activated only after the feature branch is merged to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Fetch fixtures, results and shot-level xG from PitchAPI
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          PITCHAPI_MAX_SHOT_REQUESTS: "5000"
          PITCHAPI_REFRESH_ODDS_API: "false"
        run: python backend/update_data_pitchapi.py
      - name: Refresh bookmaker odds separately via The Odds API
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python backend/update_odds.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update PitchAPI fixtures and model forecasts"
          git pull --rebase origin main
          git push
