name: Update football data

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: football-data-json-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pandas pyarrow
      - name: Fetch fixtures and calculate predictions
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python backend/update_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update football fixtures and model forecasts"
          git pull --rebase origin main
          git push
