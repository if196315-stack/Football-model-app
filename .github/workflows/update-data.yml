name: Update football data

on:
  # Refresh domestic fixtures/results every six hours without xG backfill requests.
  schedule:
    - cron: "43 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "backend/predict_uefa_markets.py"
      - "backend/update_data_pitchapi.py"
      - "backend/build_market_roi.py"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:
    inputs:
      max_shot_requests:
        description: "Maximum real shot-level xG backfill requests (manual runs only)"
        required: true
        default: "5000"
        type: choice
        options:
          - "0"
          - "250"
          - "5000"

# Scheduled runs refresh fixtures/results with shot-level xG requests disabled.
# Historical xG backfill remains manual and explicitly bounded.
concurrency:
  group: football-feed-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Restore cached PitchAPI history
        uses: actions/cache@v4
        with:
          path: backend/cache/pitchapi_history.json
          key: pitchapi-history-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pitchapi-history-${{ runner.os }}-${{ github.ref_name }}-
      - name: Fetch fixtures, results and shot-level xG from PitchAPI
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          PITCHAPI_MAX_SHOT_REQUESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_shot_requests || '0' }}
          PITCHAPI_REFRESH_ODDS_API: "false"
        run: python backend/update_data_pitchapi.py
      # The unified MelBet snapshot archive is runner-local and does not exist
      # in this workflow's checkout. Applying it here would read an empty archive
      # and delete every upcoming domestic fixture. The all-eight collector owns
      # snapshot application after it captures the archive in the same run.
      # PitchAPI supplies fixture dates, while API-Sport/MelBet provides the actual kickoff timestamp.
      # Run this after every feed rebuild so the scheduled updater cannot leave date-only fixtures behind.
      - name: Refresh kickoff times and MelBet odds
        continue-on-error: true
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/update_odds_api_sport.py
      - name: Refresh settled ALL-market ROI from the durable quote archive
        run: python backend/build_market_roi.py --snapshots /tmp/no-new-snapshots.jsonl
      - name: Commit updated data and ROI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/market-roi.json
          git diff --cached --quiet || git commit -m "Update PitchAPI data and settled market ROI"
          git pull --rebase origin main
          git push
