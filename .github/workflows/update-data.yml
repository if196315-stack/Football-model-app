name: Update football data

on:
  push:
    branches:
      - main
    paths:
      - "backend/update_data_pitchapi.py"
  workflow_dispatch:

# PitchAPI/xG refresh is manual or code-change driven to avoid unnecessary
# repeated history pulls. Odds refresh runs independently on its own schedule.
concurrency:
  group: football-data-json-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Fetch fixtures, results and shot-level xG from PitchAPI
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          PITCHAPI_MAX_SHOT_REQUESTS: "5000"
          PITCHAPI_REFRESH_ODDS_API: "false"
        run: python backend/update_data_pitchapi.py
      - name: Refresh official lineups via API-Football\n        env:\n          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}\n          FOOTBALL_API_MAX_LINEUP_REQUESTS: "10"\n        run: python -c "import os; from pathlib import Path; import sys; sys.path.insert(0, 'backend'); from pitchapi_data_source import load_cache, save_cache, CACHE_PATH; from football_api_lineups import refresh_lineups; key=os.environ.get('API_FOOTBALL_KEY', '').strip(); cache=load_cache(); summary=refresh_lineups(cache, key) if key else {'footballApiSkipped': 'API_FOOTBALL_KEY not configured'}; cache['lastRefreshSummary'].update(summary) if cache.get('lastRefreshSummary') else None; save_cache(cache); print(summary)"\n      - name: Refresh bookmaker odds via API-Sport
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/update_odds_api_sport.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update PitchAPI fixtures and model forecasts"
          git pull --rebase origin main
          git push
