name: Audit Soccer Data xG coverage

on:
  push:
    branches:
      - feature/soccer365-source-migration
    paths:
      - "backend/probe_soccer_data_coverage.py"
      - "backend/test_soccer365_provider_probe.py"
      - "backend/soccer_data_match_spot_check.py"
      - "backend/test_soccer_data_match_spot_check.py"
      - ".github/workflows/audit-soccer-data-coverage.yml"

permissions:
  contents: read

jobs:
  coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Run coverage probe unit tests
        run: python -m unittest discover -s backend -p "test_soccer365_provider_probe.py" -v
      - name: Run match-level xG audit unit tests
        run: python -m unittest discover -s backend -p "test_soccer_data_match_spot_check.py" -v
      - name: Fetch season coverage report
        env:
          SOCCER_DATA_KEY: ${{ secrets.SOCCER_DATA_KEY }}
        run: python backend/probe_soccer_data_coverage.py --output soccer-data-xg-coverage.json
      - name: Wait for API rate-limit window
        run: sleep 65
      - name: Verify real match-level xG
        env:
          SOCCER_DATA_KEY: ${{ secrets.SOCCER_DATA_KEY }}
        run: python backend/soccer_data_match_spot_check.py --output soccer-data-xg-spot-check.json
      - name: Upload coverage and match audit reports
        uses: actions/upload-artifact@v4
        with:
          name: soccer-data-xg-audit
          path: |
            soccer-data-xg-coverage.json
            soccer-data-xg-spot-check.json
          if-no-files-found: error
          retention-days: 14
