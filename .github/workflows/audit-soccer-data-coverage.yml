name: Audit Soccer Data xG coverage

on:
  push:
    branches:
      - feature/soccer365-source-migration
    paths:
      - "backend/probe_soccer_data_coverage.py"
      - "backend/test_soccer365_provider_probe.py"
      - ".github/workflows/audit-soccer-data-coverage.yml"

permissions:
  contents: read

jobs:
  coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Run probe unit tests
        run: python -m unittest discover -s backend -p "test_soccer365_provider_probe.py" -v
      - name: Fetch xG coverage report
        env:
          SOCCER_DATA_KEY: ${{ secrets.SOCCER_DATA_KEY }}
        run: python backend/probe_soccer_data_coverage.py --output soccer-data-xg-coverage.json
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: soccer-data-xg-coverage
          path: soccer-data-xg-coverage.json
          if-no-files-found: error
          retention-days: 14
