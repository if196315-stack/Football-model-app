name: API-Sport seven competition league ID cross-check

on:
  push:
    branches:
      - "audit/api-sport-tournament-ids"
    paths:
      - "backend/diagnose_api_sport_league_id_crosscheck.py"
      - ".github/workflows/diagnose-api-sport-league-id-crosscheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded diagnostic dependency
        run: python -m pip install requests
      - name: Cross-check every upcoming fixture against its API-Sport tournament ID
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/diagnose_api_sport_league_id_crosscheck.py
