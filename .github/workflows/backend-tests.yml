name: Backend odds tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  odds-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install requests pandas
      - name: Compile odds ingestion scripts
        run: python -m py_compile backend/update_bsd_odds.py backend/update_odds.py backend/update_odds_api_sport.py backend/diagnose_api_sport.py backend/update_data.py backend/update_data_pitchapi.py backend/refresh_pitchapi_uefa_fixtures.py backend/diagnose_pitchapi_uefa_xg.py backend/collect_odds_snapshots.py
      - name: Run odds market regression tests
        run: python -m unittest backend/test_update_odds.py backend/test_odds_snapshots.py backend/test_update_odds_api_sport.py backend/test_diagnose_api_sport.py backend/test_backtest_pitchapi.py backend/test_update_data_pitchapi.py backend/test_refresh_pitchapi_uefa_fixtures.py backend/test_diagnose_pitchapi_uefa_xg.py -v
