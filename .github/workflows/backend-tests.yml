name: Backend odds tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  odds-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install requests pandas numpy
      - name: Compile odds ingestion and AI audit scripts
        run: python -m compileall -q backend
      - name: Run Android-parity AI audit tests
        run: python -m unittest backend.test_audit_domestic_ai_signals -v
      - name: Run odds market regression tests
        run: python -m unittest backend/test_*.py backend/tests/test_recent_team_form.py -v
