name: Collect prospective bookmaker odds snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pitchapi-data-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Collect current 1X2 reference snapshots
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p artifacts
          python backend/collect_odds_snapshots.py \
            --input docs/data.json \
            --output artifacts/odds-snapshots.jsonl
      - name: Probe strategy markets on a bounded sample
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python backend/probe_odds_markets.py \
            --input docs/data.json \
            --output artifacts/odds-market-probe.jsonl \
            --max-events-per-league 1
      - name: Upload odds archives
        uses: actions/upload-artifact@v4
        with:
          name: prospective-odds-market-probe
          path: |
            artifacts/odds-snapshots.jsonl
            artifacts/odds-market-probe.jsonl
          if-no-files-found: error
          retention-days: 90
