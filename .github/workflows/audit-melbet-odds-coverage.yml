name: Audit MelBet odds coverage (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/audit_melbet_odds_coverage.py"
      - "backend/test_audit_melbet_odds_coverage.py"
      - ".github/workflows/audit-melbet-odds-coverage.yml"

permissions:
  contents: read

concurrency:
  group: melbet-odds-coverage-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Run parser tests
        run: python -m unittest backend.test_audit_melbet_odds_coverage -v
      - name: Collect MelBet odds and build coverage report
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
        run: python backend/audit_melbet_odds_coverage.py
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: melbet-odds-coverage
          path: |
            artifacts/melbet-odds-coverage.json
            artifacts/melbet-odds-coverage.md
          retention-days: 30
