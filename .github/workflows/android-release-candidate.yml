name: Android release candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release-candidate.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release-candidate.yml"

permissions:
  contents: read

concurrency:
  group: android-release-candidate
  cancel-in-progress: false

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/football-model-upload-key.jks"
          test -s "$RUNNER_TEMP/football-model-upload-key.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/football-model-upload-key.jks" >> "$GITHUB_ENV"

      - name: Diagnose release signing key (no secrets printed)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set +x
          KEYSTORE_PATH="$ANDROID_KEYSTORE_FILE"
          ACTUAL_SHA="$(sha256sum "$KEYSTORE_PATH" | awk '{print toupper($1)}')"
          EXPECTED_SHA="06394642547E6ACC577F027ACB6A0D92B6B7467A55113B117248E142B45F02AB"
          if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
            echo "KEYSTORE_SHA_MATCH=yes"
          else
            echo "KEYSTORE_SHA_MATCH=no"
            exit 1
          fi

          echo "Checking store password (without alias)..."
          if keytool -list -keystore "$KEYSTORE_PATH" -storetype JKS -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>"$RUNNER_TEMP/store-check.err"; then
            echo "STORE_PASSWORD_OK"
          else
            echo "STORE_PASSWORD_FAILED"
            exit 1
          fi

          echo "Checking alias..."
          if keytool -list -keystore "$KEYSTORE_PATH" -storetype JKS -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/alias-check.err"; then
            echo "ALIAS_OK"
          else
            echo "ALIAS_FAILED"
            exit 1
          fi

          echo "Checking private-key password..."
          if keytool -certreq -keystore "$KEYSTORE_PATH" -storetype JKS -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD" -file "$RUNNER_TEMP/signing-diagnostic.csr" >/dev/null 2>"$RUNNER_TEMP/key-check.err"; then
            rm -f "$RUNNER_TEMP/signing-diagnostic.csr"
            echo "PRIVATE_KEY_PASSWORD_OK"
          else
            echo "PRIVATE_KEY_PASSWORD_FAILED"
            exit 1
          fi

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Run Android unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run release lint
        working-directory: android
        run: gradle :app:lintRelease --no-daemon --stacktrace

      - name: Assemble release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signed APK
        if: github.event_name != 'pull_request'
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release candidate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Football-Model-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned PR candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Football-Model-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
