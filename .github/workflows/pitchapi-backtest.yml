name: PitchAPI seven-competition all-market backtest

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pitchapi-data-source
    paths:
      - backend/backtest_all_markets.py
      - backend/test_backtest_all_markets.py
      - .github/workflows/pitchapi-backtest.yml

permissions:
  contents: read

concurrency:
  group: pitchapi-all-market-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    if: github.ref == 'refs/heads/feature/pitchapi-data-source'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore historical five-league PitchAPI cache
        uses: actions/cache/restore@v4
        with:
          path: backend/cache/pitchapi_history.json
          key: pitchapi-history-backtest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pitchapi-history-v1-
      - name: Fetch current main UEFA xG archive
        uses: actions/checkout@v4
        with:
          ref: main
          path: uefa-source
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Export clean domestic xG cohort
        run: python backend/export_pitchapi_backtest.py
      - name: Run seven-competition all-market walk-forward backtest
        run: |
          python backend/backtest_all_markets.py \
            --domestic artifacts/pitchapi-clean-candidate.csv \
            --uefa uefa-source/artifacts/uefa-xg-history.json \
            --output artifacts/seven-competition-all-market-report.json \
            --holdout-from 2026-07-01
      - name: Upload reproducible datasets and report
        uses: actions/upload-artifact@v4
        with:
          name: seven-competition-all-market-backtest-${{ github.run_number }}
          path: |
            artifacts/pitchapi-clean-candidate.csv
            artifacts/pitchapi-clean-candidate-manifest.json
            artifacts/seven-competition-all-market-report.json
          if-no-files-found: error
          retention-days: 30
