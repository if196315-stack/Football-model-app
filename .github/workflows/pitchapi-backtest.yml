name: PitchAPI reproducible backtest

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pitchapi-data-source
    paths:
      - "backend/export_pitchapi_backtest.py"
      - "backend/backtest_pitchapi.py"
      - "backend/pitchapi_data_source.py"
      - ".github/workflows/pitchapi-backtest.yml"

permissions:
  contents: read

concurrency:
  group: pitchapi-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    if: github.ref == 'refs/heads/feature/pitchapi-data-source'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore latest PitchAPI history cache
        uses: actions/cache/restore@v4
        with:
          path: backend/cache/pitchapi_history.json
          key: pitchapi-history-backtest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pitchapi-history-v1-
      - name: Install dependencies
        run: python -m pip install requests pandas
      - name: Build clean paired-xG cohort
        run: python backend/export_pitchapi_backtest.py
      - name: Run strict chronological walk-forward backtest
        run: |
          python backend/backtest_pitchapi.py \
            --input artifacts/pitchapi-clean-candidate.csv \
            --output artifacts/pitchapi-backtest-report.json \
            --holdout-from 2026-07-01
      - name: Upload reproducible backtest outputs
        uses: actions/upload-artifact@v4
        with:
          name: pitchapi-reproducible-backtest-${{ github.run_number }}
          path: |
            artifacts/pitchapi-clean-candidate.csv
            artifacts/pitchapi-clean-candidate-manifest.json
            artifacts/pitchapi-backtest-report.json
          if-no-files-found: error
          retention-days: 30
