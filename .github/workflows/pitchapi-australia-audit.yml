name: Isolated PitchAPI Australia A-League audit

on:
  push:
    branches:
      - research/pitchapi-australia-audit
    paths:
      - "research/pitchapi_australia_audit.py"
      - ".github/workflows/pitchapi-australia-audit.yml"

permissions:
  contents: read

concurrency:
  group: pitchapi-australia-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated audit dependency
        run: python -m pip install requests
      - name: Read A-League catalogue, fixtures and sampled xG
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python research/pitchapi_australia_audit.py
      - name: Upload standalone research report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pitchapi-australia-a-league-audit
          path: pitchapi-australia-a-league-audit.json
          if-no-files-found: warn
          retention-days: 14
