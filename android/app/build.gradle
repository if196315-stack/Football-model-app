plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.footballmodel.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.footballmodel.app'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.6'
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
}
